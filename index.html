<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1130" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3e8cf" media="(prefers-color-scheme: light)">
<style>*{box-sizing:border-box}img{max-width:100%;height:auto}[hidden]{display:none!important}</style>
<title>Sen Hangi Cadısın?</title>
<meta name="description" content="Pasaklı Cadı kitabı için altı soruluk eğlenceli cadı testi." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gluten:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" />
<style>
  :root {
    /* Parchment "spell-book" light theme — the in-book manuscript */
    --night: #f3e8cf;
    --surface: #fffaef;
    --surface-2: #f8efd8;
    --ink: #33244a;
    --ink-soft: #6b5a7e;
    --magenta: #a8377f;
    --magenta-soft: #c65fa2;
    --forest: #3f6f47;
    --gold: #c8892f;
    --line: #e2d3b2;
    --spark: #e0a844;
    --shadow: 24px 24px 60px rgba(58, 35, 82, 0.14);
    --star-a: rgba(168, 55, 127, 0.12);
    --star-b: rgba(200, 137, 47, 0.14);
  }
  :root:not([data-theme="light"]) {
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --night: #1e1130;
      --surface: #2c1a44;
      --surface-2: #35204f;
      --ink: #f4e8ce;
      --ink-soft: #bda9d3;
      --magenta: #e07fc0;
      --magenta-soft: #c563a6;
      --forest: #8dc487;
      --gold: #ecab52;
      --line: rgba(244, 232, 206, 0.14);
      --spark: #fff2d4;
      --shadow: 24px 24px 70px rgba(0, 0, 0, 0.45);
      --star-a: rgba(224, 127, 192, 0.16);
      --star-b: rgba(236, 171, 82, 0.16);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --night: #1e1130;
    --surface: #2c1a44;
    --surface-2: #35204f;
    --ink: #f4e8ce;
    --ink-soft: #bda9d3;
    --magenta: #e07fc0;
    --magenta-soft: #c563a6;
    --forest: #8dc487;
    --gold: #ecab52;
    --line: rgba(244, 232, 206, 0.14);
    --spark: #fff2d4;
    --shadow: 24px 24px 70px rgba(0, 0, 0, 0.45);
    --star-a: rgba(224, 127, 192, 0.16);
    --star-b: rgba(236, 171, 82, 0.16);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background-color: var(--night);
    background-image:
      radial-gradient(2px 2px at 12% 18%, var(--star-b), transparent 60%),
      radial-gradient(2px 2px at 82% 12%, var(--star-a), transparent 60%),
      radial-gradient(1.5px 1.5px at 68% 32%, var(--star-b), transparent 60%),
      radial-gradient(1.5px 1.5px at 26% 62%, var(--star-a), transparent 60%),
      radial-gradient(2px 2px at 90% 74%, var(--star-b), transparent 60%),
      radial-gradient(1.5px 1.5px at 44% 88%, var(--star-a), transparent 60%),
      radial-gradient(2px 2px at 8% 82%, var(--star-b), transparent 60%);
    background-attachment: scroll;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 680px;
    margin: 0 auto;
    padding: clamp(20px, 5vw, 56px) clamp(16px, 5vw, 28px) 64px;
  }

  /* magic dust canvas — floats above the card, never blocks taps */
  #fx {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
  }

  .page {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: clamp(22px, 5vw, 44px);
    box-shadow: var(--shadow);
  }
  .page::after {
    content: "#AAA";
    position: absolute;
    right: 18px;
    bottom: -13px;
    font-family: "Nunito", sans-serif;
    font-weight: 800;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    color: var(--ink-soft);
    background: var(--surface-2);
    border: 1px solid var(--line);
    padding: 4px 10px;
    border-radius: 6px;
    transform: rotate(-3deg);
  }

  /* The opening is a title page. The cover carries the book's own credits,
     so the card chrome steps aside and the art takes the whole screen. */
  #start { text-align: center; }
  #start h1 { margin-bottom: 24px; }
  #start .btn-row { justify-content: center; }

  .page.is-cover {
    background: transparent;
    border-color: transparent;
    box-shadow: none;
    margin-top: 0;
    display: flex;
    flex-direction: column;
    /* "safe" keeps the top reachable if the content ever outgrows the screen */
    justify-content: center;
    justify-content: safe center;
    min-height: calc(100vh - 72px);
    min-height: calc(100svh - 72px);
  }
  .page.is-cover::after { display: none; }

  h1 {
    font-family: "Gluten", "Nunito", cursive;
    font-weight: 800;
    font-size: clamp(2.05rem, 8.5vw, 3.9rem);
    line-height: 0.98;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
    text-wrap: balance;
    overflow-wrap: break-word;
    color: var(--ink);
  }
  h1 .cadi { display: block; color: var(--magenta); }
  /* A highlight sweeps across the word. Both keyframe positions keep the
     gradient box covering the whole span — outside that range the clipped
     text would render transparent. */
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    h1 .cadi {
      background-image: linear-gradient(100deg,
        var(--magenta) 34%, var(--gold) 45%, var(--spark) 50%, var(--gold) 55%, var(--magenta) 66%);
      background-size: 280% 100%;
      background-position: 100% 0;
      background-repeat: no-repeat;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 6s ease-in-out 1s infinite;
    }
  }
  @keyframes shimmer {
    0%, 62%, 100% { background-position: 100% 0; }
    31% { background-position: 0% 0; }
  }

  .cover-hero {
    position: relative;
    margin: 0 0 clamp(24px, 5vw, 34px);
    display: flex;
    justify-content: center;
  }
  /* a warm light behind the art, so it sits in the scene rather than on it */
  .cover-hero::before {
    content: "";
    position: absolute;
    left: 50%; top: 52%;
    width: 132%; height: 116%;
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse at center,
      color-mix(in srgb, var(--gold) 30%, transparent) 0%,
      transparent 68%);
    pointer-events: none;
  }
  .cover-hero img {
    position: relative;
    /* bounded on both axes so the cover never outgrows a short screen */
    width: auto;
    max-width: min(74vw, 332px);
    max-height: 56svh;
    border-radius: 10px;
    box-shadow: 0 28px 64px -14px rgba(18, 7, 38, 0.6);
    transform: rotate(-2deg);
    animation: hover-book 7s ease-in-out infinite;
  }
  @keyframes hover-book {
    0%, 100% { transform: rotate(-2deg) translateY(0); }
    50% { transform: rotate(-1deg) translateY(-10px); }
  }
  /* opening the book: the cover lifts away into the quiz */
  .cover-hero.leaving img { animation: bookOpen 0.42s ease-in forwards; }
  @keyframes bookOpen {
    to { transform: rotate(-7deg) translateY(-42px) scale(1.07); opacity: 0; }
  }

  .start-note {
    margin: 16px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  .btn {
    appearance: none;
    border: none;
    background: var(--magenta);
    color: #fff;
    font-weight: 800;
    font-size: 1.02rem;
    letter-spacing: 0.01em;
    padding: 14px 26px;
    border-radius: 999px;
    box-shadow: 0 10px 24px -8px var(--magenta);
    transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
  }
  .btn:hover { transform: translateY(-2px); background: var(--magenta-soft); }
  .btn:active { transform: translateY(0); }

  .btn-ghost {
    background: transparent;
    color: var(--magenta);
    border: 1.5px solid var(--line);
    box-shadow: none;
  }
  .btn-ghost:hover { background: var(--surface-2); color: var(--magenta); }

  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

  /* pulsing halo on the call to action */
  .btn-magic { position: relative; }
  .btn-magic::after {
    content: "";
    position: absolute;
    inset: -5px;
    border-radius: 999px;
    border: 2px solid var(--magenta);
    opacity: 0;
    pointer-events: none;
    animation: halo 3s ease-out infinite;
  }
  @keyframes halo {
    0% { transform: scale(0.94); opacity: 0.5; }
    65%, 100% { transform: scale(1.24); opacity: 0; }
  }

  /* progress */
  .progress {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 22px;
  }
  .progress .dot {
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--line);
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .progress .dot.done { background: var(--gold); }
  .progress .dot.current { background: var(--magenta); transform: scale(1.35); }
  .progress .count {
    margin-left: auto;
    font-size: 0.8rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .q-num {
    font-family: "Gluten", cursive;
    font-weight: 700;
    color: var(--gold);
    font-size: 1.1rem;
    margin: 0 0 4px;
  }
  h2.q-text {
    font-family: "Nunito", sans-serif;
    font-weight: 800;
    font-size: clamp(1.35rem, 4vw, 1.7rem);
    line-height: 1.25;
    margin: 0 0 22px;
    text-wrap: balance;
    color: var(--ink);
  }

  .options { display: flex; flex-direction: column; gap: 12px; }
  .opt {
    text-align: left;
    background: var(--surface-2);
    border: 1.5px solid var(--line);
    border-radius: 13px;
    padding: 15px 17px;
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.45;
    display: flex;
    gap: 13px;
    align-items: flex-start;
    transition: transform 0.13s ease, border-color 0.13s ease, background 0.13s ease;
  }
  .opt:hover { transform: translateX(4px); border-color: var(--magenta-soft); }
  .opt:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }
  .opt .tick {
    flex: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--magenta-soft);
    margin-top: 1px;
    display: grid;
    place-items: center;
  }
  .opt.sel { border-color: var(--magenta); background: color-mix(in srgb, var(--magenta) 12%, var(--surface-2)); }
  .opt.sel .tick { background: var(--magenta); border-color: var(--magenta); }
  .opt.sel .tick::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; }

  .nav-row { display: flex; justify-content: space-between; margin-top: 24px; gap: 12px; }

  /* result */
  .result-head { display: flex; align-items: center; gap: 16px; margin-bottom: 6px; flex-wrap: wrap; }
  .result-head > div { min-width: 0; flex: 1 1 auto; }
  .crest {
    position: relative;
    flex: none;
    width: 66px; height: 66px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: color-mix(in srgb, var(--accent, var(--magenta)) 16%, var(--surface));
    border: 2px solid var(--accent, var(--magenta));
  }
  .crest::after {
    content: "";
    position: absolute;
    inset: -7px;
    border-radius: 50%;
    border: 2px solid var(--accent, var(--magenta));
    opacity: 0;
    animation: halo 3.4s ease-out 0.7s infinite;
  }
  .crest svg { width: 34px; height: 34px; }
  .result-kicker {
    margin: 0;
    font-weight: 800;
    font-size: 0.74rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  h2.result-name {
    font-family: "Gluten", cursive;
    font-weight: 800;
    font-size: clamp(1.6rem, 6.2vw, 2.9rem);
    line-height: 1.04;
    margin: 2px 0 0;
    overflow-wrap: break-word;
    color: var(--accent, var(--magenta));
  }
  .result-tag { font-size: 1.05rem; color: var(--ink-soft); font-style: italic; margin: 10px 0 18px; }
  .result-body { font-size: 1.02rem; margin: 0 0 18px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .chip {
    font-size: 0.82rem;
    font-weight: 800;
    letter-spacing: 0.02em;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--ink);
  }

  .book-link {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent, var(--magenta));
    border-radius: 10px;
    padding: 13px 16px;
    font-size: 0.95rem;
    margin-bottom: 22px;
  }
  .book-link strong { color: var(--accent, var(--magenta)); }

  .plate {
    margin: 0 0 20px;
    background: #fbf6ea;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 12px 8px;
  }
  .plate img {
    display: block;
    width: 100%;
    max-width: 360px;
    margin: 0 auto;
    border-radius: 6px;
    mix-blend-mode: multiply;
  }
  .plate figcaption {
    margin-top: 8px;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: #8a7c63;
    text-align: right;
  }

  .foot {
    margin-top: 26px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 0.8rem;
    color: var(--ink-soft);
  }
  .foot p { margin: 3px 0; }

  .theme-toggle {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: calc(env(safe-area-inset-right, 0px) + 14px);
    z-index: 6;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    display: grid;
    place-items: center;
    font-size: 1rem;
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
  }

  /* "büyü yapılıyor" — the casting moment before the result */
  .cast {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: grid;
    place-items: center;
    background: var(--night);
    background: color-mix(in srgb, var(--night) 90%, transparent);
    animation: castIn 0.22s ease both;
  }
  .cast[hidden] { display: none; }
  .cast.out { animation: castOut 0.3s ease both; }
  @keyframes castIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes castOut { to { opacity: 0; } }

  .cast-inner { display: grid; place-items: center; gap: 22px; text-align: center; padding: 20px; }

  .cast-stage {
    --stage: min(72vw, 230px);
    position: relative;
    width: var(--stage);
    aspect-ratio: 1;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* the spell circle: two counter-turning rune rings and one racing arc */
  .cast-rings { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .cast-rings circle { fill: none; transform-origin: 50% 50%; }
  .cast-rings .r-out {
    stroke: var(--gold); stroke-width: 2; opacity: 0.5;
    stroke-dasharray: 3 11;
    animation: spin 16s linear infinite;
  }
  .cast-rings .r-mid {
    stroke: var(--magenta); stroke-width: 1.5; opacity: 0.45;
    stroke-dasharray: 1 9;
    animation: spin 11s linear reverse infinite;
  }
  .cast-rings .r-sweep {
    stroke: var(--magenta); stroke-width: 3; stroke-linecap: round;
    stroke-dasharray: 66 468;
    animation: spin 2s linear infinite;
  }

  /* objects from the book, orbiting: süpürge, şapka, yumak, iksir, kitap, yıldız */
  .cast-orbit { position: absolute; inset: 0; animation: spin 13s linear infinite; }
  .cast-orbit .orb {
    position: absolute;
    top: 50%; left: 50%;
    width: 26px; height: 26px;
    margin: -13px 0 0 -13px;
    /* sit on a ring sized from the stage, just inside the rune circles */
    transform: rotate(calc(var(--i) * 60deg)) translateY(calc(var(--stage) * -0.38));
    color: var(--gold);
  }
  /* undo the seat angle so each object stays upright as the ring turns */
  .cast-orbit .orb-in {
    display: block; width: 100%; height: 100%;
    transform: rotate(calc(var(--i) * -60deg));
  }
  .cast-orbit .orb svg {
    display: block; width: 100%; height: 100%;
    fill: none; stroke: currentColor; stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round;
    animation: spin 13s linear reverse infinite, orbFade 3.2s ease-in-out infinite;
    animation-delay: 0s, calc(var(--i) * -0.5s);
  }
  @keyframes orbFade {
    0%, 100% { opacity: 0.42; }
    50% { opacity: 1; }
  }

  /* the crossed wands at the centre */
  .cast-wands {
    position: absolute;
    left: 50%; top: 50%;
    width: 56%; height: 56%;
    transform: translate(-50%, -50%);
    overflow: visible;
  }
  .cast-wands .w { transform-origin: 60px 100px; }
  .cast-wands .w1 { animation: scissorL 2.4s ease-in-out infinite; }
  .cast-wands .w2 { animation: scissorR 2.4s ease-in-out infinite; }
  @keyframes scissorL {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(3deg); }
  }
  @keyframes scissorR {
    0%, 100% { transform: rotate(5deg); }
    50% { transform: rotate(-3deg); }
  }
  .cast-wands .shaft { stroke: var(--ink); stroke-width: 5.5; stroke-linecap: round; fill: none; opacity: 0.85; }
  .cast-wands .grip { stroke: var(--gold); stroke-width: 7; stroke-linecap: round; fill: none; }
  .cast-wands .tip { fill: var(--spark); transform-box: fill-box; transform-origin: 50% 50%; }
  .cast-wands .w1 .tip { animation: tipFlare 1.2s ease-in-out infinite; }
  .cast-wands .w2 .tip { animation: tipFlare 1.2s ease-in-out 0.6s infinite; }
  @keyframes tipFlare {
    0%, 100% { transform: scale(0.7) rotate(0deg); opacity: 0.75; }
    50% { transform: scale(1.25) rotate(45deg); opacity: 1; }
  }

  .cast-text {
    margin: 0;
    font-family: "Gluten", "Nunito", cursive;
    font-weight: 700;
    font-size: 1.25rem;
    color: var(--ink);
  }
  .cast-text i {
    display: inline-block;
    font-style: normal;
    animation: dotHop 1.1s ease-in-out infinite;
  }
  .cast-text i:nth-child(2) { animation-delay: 0.15s; }
  .cast-text i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dotHop {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.45; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  .snd-toggle {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: calc(env(safe-area-inset-right, 0px) + 62px);
    z-index: 6;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    display: grid;
    place-items: center;
    padding: 0;
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
  }
  .snd-toggle svg {
    width: 21px; height: 21px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .snd-toggle .spk { fill: currentColor; stroke-linejoin: round; }
  .snd-toggle .cross { display: none; }
  .snd-toggle.is-off .wave { display: none; }
  .snd-toggle.is-off .cross { display: block; }
  .snd-toggle.is-off { color: var(--ink-soft); }

  .screen { animation: fade 0.32s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* result reveal, staggered top to bottom */
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes popIn { from { opacity: 0; transform: scale(0.45); } to { opacity: 1; transform: scale(1); } }
  #result.reveal .crest { animation: popIn 0.6s cubic-bezier(0.2, 1.5, 0.4, 1) both; }
  #result.reveal .result-kicker,
  #result.reveal .result-name { animation: rise 0.5s 0.08s ease both; }
  #result.reveal .result-tag { animation: rise 0.5s 0.16s ease both; }
  #result.reveal .plate { animation: rise 0.55s 0.24s ease both; }
  #result.reveal .result-body { animation: rise 0.5s 0.32s ease both; }
  #result.reveal .chips { animation: rise 0.5s 0.4s ease both; }
  #result.reveal .book-link { animation: rise 0.5s 0.46s ease both; }
  #result.reveal .btn-row { animation: rise 0.5s 0.52s ease both; }

  @media (prefers-reduced-motion: reduce) {
    *, .screen { animation: none !important; transition: none !important; }
    /* the shimmer relies on a moving gradient — fall back to flat ink */
    h1 .cadi {
      background-image: none;
      -webkit-text-fill-color: var(--magenta);
      color: var(--magenta);
    }
    .cover-hero img { transform: rotate(-2deg); }

  @media (max-width: 520px) {
    .wrap { padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 52px; }

      right: calc(env(safe-area-inset-right, 0px) + 58px);

    .nav-row { margin-top: 20px; }
    .result-head { gap: 14px; }
  }
  @media (max-width: 460px) {
    .page::after { right: 12px; }
    .opt { padding: 14px 14px; gap: 11px; }
    .crest { width: 56px; height: 56px; }
    .crest svg { width: 28px; height: 28px; }
    h2.q-text { margin-bottom: 18px; }
  }
  @media (hover: none) {
    .opt:hover { transform: none; }
    .btn:hover { transform: none; }
    .btn-ghost:hover { background: transparent; color: var(--magenta); }
  }
</style>

<script>
(function () {
  "use strict";

  var REDUCED = false;
  try { REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}

  /* ---- sihir tozu: ambient motes + puffs, drawn on one canvas ---- */
  var FX = (function () {
    var cvs = document.getElementById("fx");
    if (!cvs || !cvs.getContext) return { burst: noop, swirl: noop, center: center, refresh: noop };
    var ctx = cvs.getContext("2d");
    var W = 0, H = 0, raf = 0;
    var motes = [], parts = [];
    var col = { a: "#d976b4", b: "#e9a94b", s: "#fff2d4" };

    function noop() {}
    function center(el) {
      var r = el.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }

    function refresh() {
      var cs = getComputedStyle(document.documentElement);
      function g(n, d) { var v = cs.getPropertyValue(n); return (v && v.trim()) || d; }
      col.a = g("--magenta", col.a);
      col.b = g("--gold", col.b);
      col.s = g("--spark", col.s);
    }
    function pick() {
      var r = Math.random();
      return r < 0.45 ? col.a : r < 0.8 ? col.b : col.s;
    }

    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      cvs.width = Math.round(W * dpr);
      cvs.height = Math.round(H * dpr);
      cvs.style.width = W + "px";
      cvs.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      seed();
    }

    function mote(spread) {
      return {
        x: Math.random() * W,
        y: spread ? Math.random() * H : H + 12,
        r: 1 + Math.random() * 2.6,
        vy: -(0.08 + Math.random() * 0.2),
        vx: (Math.random() - 0.5) * 0.12,
        p: Math.random() * 6.28,
        ps: 0.008 + Math.random() * 0.016,
        c: pick()
      };
    }
    function seed() {
      var n = Math.max(12, Math.min(38, Math.round((W * H) / 32000)));
      motes = [];
      for (var i = 0; i < n; i++) motes.push(mote(true));
    }

    /* four-point sparkle */
    function star(x, y, r, a, c) {
      if (a <= 0.01) return;
      ctx.globalAlpha = a > 1 ? 1 : a;
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.moveTo(x, y - r);
      ctx.quadraticCurveTo(x + r * 0.16, y - r * 0.16, x + r, y);
      ctx.quadraticCurveTo(x + r * 0.16, y + r * 0.16, x, y + r);
      ctx.quadraticCurveTo(x - r * 0.16, y + r * 0.16, x - r, y);
      ctx.quadraticCurveTo(x - r * 0.16, y - r * 0.16, x, y - r);
      ctx.fill();
    }

    function tick() {
      ctx.clearRect(0, 0, W, H);
      var i, m, p;
      for (i = 0; i < motes.length; i++) {
        m = motes[i];
        m.y += m.vy; m.x += m.vx; m.p += m.ps;
        if (m.y < -14) { motes[i] = mote(false); continue; }
        star(m.x, m.y, m.r, 0.16 + 0.3 * (0.5 + 0.5 * Math.sin(m.p)), m.c);
      }
      for (i = parts.length - 1; i >= 0; i--) {
        p = parts[i];
        if (--p.life <= 0) { parts.splice(i, 1); continue; }
        if (p.mode === 1) {
          p.ang += p.av;
          p.rad *= 0.955;
          p.x = p.cx + Math.cos(p.ang) * p.rad;
          p.y = p.cy + Math.sin(p.ang) * p.rad;
        } else {
          p.vy += 0.035;
          p.vx *= 0.985;
          p.x += p.vx; p.y += p.vy;
        }
        var k = p.life / p.max;
        star(p.x, p.y, p.r * k + 0.4, k * 1.4, p.c);
      }
      ctx.globalAlpha = 1;
      raf = requestAnimationFrame(tick);
    }

    function cap() { if (parts.length > 380) parts.splice(0, parts.length - 380); }

    /* üfle püfle: outward puff */
    function burst(x, y, n, power) {
      if (REDUCED) return;
      n = n || 18; power = power || 1;
      for (var i = 0; i < n; i++) {
        var a = Math.random() * 6.28;
        var sp = (0.9 + Math.random() * 2.6) * power;
        var life = 32 + Math.random() * 30;
        parts.push({ mode: 0, x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.7,
          r: 1.3 + Math.random() * 3.2, life: life, max: life, c: pick() });
      }
      cap();
    }

    /* particles spiralling inward, for the casting moment */
    function swirl(x, y, n) {
      if (REDUCED) return;
      n = n || 40;
      for (var i = 0; i < n; i++) {
        var a = Math.random() * 6.28;
        var rad = 110 + Math.random() * 230;
        var life = 46 + Math.random() * 32;
        parts.push({ mode: 1, cx: x, cy: y, ang: a, rad: rad,
          av: (Math.random() < 0.5 ? -1 : 1) * (0.04 + Math.random() * 0.05),
          x: x + Math.cos(a) * rad, y: y + Math.sin(a) * rad,
          r: 1.5 + Math.random() * 3, life: life, max: life, c: pick() });
      }
      cap();
    }

    refresh();
    resize();
    window.addEventListener("resize", resize);

    if (REDUCED) {
      for (var i = 0; i < motes.length; i++) star(motes[i].x, motes[i].y, motes[i].r, 0.28, motes[i].c);
    } else {
      raf = requestAnimationFrame(tick);
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
        else if (!raf) raf = requestAnimationFrame(tick);
      });
    }

    return { burst: burst, swirl: swirl, center: center, refresh: refresh };
  })();

     Dosya yok, her şey tarayıcıda sentezleniyor: telif yok, bayt yok.
     Arpej değil, yazılmış 16 ölçülük bir tema çalıyor. */
  var SND = (function () {
    var ctx = null, master, musicBus, sfxBus, verb, noise;
    var timer = null, stepN = 0, loopN = 0, nextTime = 0;
    var playing = false, mode = "quiz", muted = false;
    var BPM = 66, SPB = 60 / BPM, GRID = SPB / 2;
    var LEVEL = { quiz: 0.44, cast: 0.72, result: 0.4 };

    try { muted = localStorage.getItem("pc-mute") === "1"; } catch (e) {}

    var N = {
      A2: 110.00, C3: 130.81, D3: 146.83, F2: 87.31, G2: 98.00,
      F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
      C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00,
      A4: 440.00, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25,
      F5: 698.46, G5: 783.99, A5: 880.00, B5: 987.77, C6: 1046.50, D6: 1174.66
    };

    var CH = {
      Am: { bass: N.A2, pad: [N.A3, N.C4, N.E4] },
      F:  { bass: N.F2, pad: [N.F3, N.A3, N.C4] },
      C:  { bass: N.C3, pad: [N.C4, N.E4, N.G4] },
      G:  { bass: N.G2, pad: [N.G3, N.B3, N.D4] },
      Dm: { bass: N.D3, pad: [N.F3, N.A3, N.D4] }
    };
    var HARM = ["Am","Am","F","F","C","C","G","G",
                "Dm","Dm","Am","Am","F","F","G","G"];

    /* Tema — [frekans, vuruş]; 0 = sus. Her ölçü 4 vuruş. */
    var THEME = [
      [[N.A4,1],[N.C5,1],[N.E5,1.5],[N.D5,0.5]],
      [[N.C5,2],[N.A4,2]],
      [[N.A5,1],[N.G5,1],[N.F5,2]],
      [[N.E5,1.5],[N.C5,1],[0,1.5]],
      [[N.G5,1],[N.E5,1],[N.C5,1.5],[N.D5,0.5]],
      [[N.E5,2],[N.G5,2]],
      [[N.D5,1],[N.G5,1],[N.B5,2]],
      [[N.A5,2],[0,2]],
      [[N.D5,1],[N.F5,1],[N.A5,2]],
      [[N.G5,1.5],[N.F5,0.5],[N.D5,2]],
      [[N.C5,1],[N.E5,1],[N.A5,2]],
      [[N.G5,2],[N.E5,2]],

    },
    {
      q: "Arkadaşların seni en çok nasıl tarif eder?",
      a: [
        ["orman", "Doğayı seven, sakin ve güvenilir"],
        ["su", "Cesur, özgür ve maceracı"],
        ["kristal", "Meraklı, dikkatli ve araştırmacı"],
        ["paldir", "Biraz dağınık ama çok yaratıcı"]
      ]
    },
    {
      q: "Önünde çözmen gereken gizemli bir bilmece var. Ne yaparsın?",
      a: [
        ["orman", "Çevremdeki bütün ipuçlarını incelerim."],
        ["su", "Fazla düşünmeden maceraya atılırım."],
        ["kristal", "Araştırır, bilgi toplarım."],
        ["paldir", "Aklıma gelen bütün yöntemleri denerim; biri mutlaka tutar!"]
      ]
    },
    {
      q: "Sihirli eşyan hangisi olsun isterdin?",
      a: [
        ["orman", "Yaprak biçiminde bir kolye"],
        ["su", "Gizemli bir deniz kabuğu"],
        ["kristal", "Işık saçan bir kristal"],
        ["paldir", "İçinden ne çıkacağı belli olmayan karmakarışık bir çanta"]
      ]
    },
    {
      q: "Bir arkadaşının başı derde girdiğinde ne yaparsın?",
      a: [
        ["orman", "Yanında olur, sakin bir çözüm bulmaya çalışırım."],
        ["su", "Hiç düşünmeden yardıma koşarım."],
        ["kristal", "Önce ne olduğunu anlamaya çalışırım."],
        ["paldir", "Planım olmayabilir ama onu asla yalnız bırakmam."]
      ]
    },
    {
      q: "Cadılık sınavına hazırlanıyorsun. Odan nasıl görünür?",
      a: [
        ["orman", "Bitkiler, yapraklar ve kitaplarla dolu."],
        ["su", "Maceraya çıkmak için hazırlanmış çantalar her yerde."],
        ["kristal", "Taşlar, notlar ve gizemli objeler düzenli şekilde sıralanmış."],
        ["paldir", "Her şey her yerde! Ama ben neyin nerede olduğunu aşağı yukarı biliyorum. :)"]
      ]
    }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var answers = new Array(QUESTIONS.length).fill(null);
  var idx = 0;

  /* theme toggle */
  var st = $("sndToggle");
  function paintSnd() {
    var off = SND.isMuted();
    st.classList.toggle("is-off", off);
    st.setAttribute("aria-pressed", off ? "false" : "true");
    st.setAttribute("aria-label", off ? "Sesi aç" : "Sesi kapat");
  }
  paintSnd();
  st.addEventListener("click", function () {
    var willMute = !SND.isMuted();
    SND.setMuted(willMute);
    paintSnd();
    if (!willMute) {
      /* kapak ekranında değilsek test sürüyordur — müziği geri getir */
      if ($("start").hidden) SND.start();
      SND.sfx("pick");
    }
  });

  var tt = $("themeToggle");
  tt.addEventListener("click", function () {
    var root = document.documentElement;
    var cur = root.getAttribute("data-theme");
    var next = cur === "dark" ? "light" : cur === "light" ? "dark"
      : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
    root.setAttribute("data-theme", next);
    FX.refresh();
    var c = FX.center(tt);
    FX.burst(c.x, c.y, 12, 0.8);
  });

  var page = document.querySelector(".page");

  function show(id) {
    ["start", "quiz", "result"].forEach(function (s) { $(s).hidden = s !== id; });
    if (page) page.classList.toggle("is-cover", id === "start");
    var el = $(id);
    el.classList.remove("screen"); void el.offsetWidth; el.classList.add("screen");
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  function renderProgress() {
    var p = $("progress");
    p.innerHTML = "";
    for (var i = 0; i < QUESTIONS.length; i++) {
      var d = document.createElement("span");
      d.className = "dot" + (i < idx ? " done" : "") + (i === idx ? " current" : "");
      p.appendChild(d);
    }
    var c = document.createElement("span");
    c.className = "count";
    c.textContent = (idx + 1) + " / " + QUESTIONS.length;
    p.appendChild(c);
  }

  function renderQuestion() {
    var Q = QUESTIONS[idx];
    renderProgress();
    $("qNum").textContent = (idx + 1) + ". Soru";
    $("qText").textContent = Q.q;
    var box = $("options");
    box.innerHTML = "";
    Q.a.forEach(function (pair, i) {
      var b = document.createElement("button");
      b.className = "opt" + (answers[idx] === pair[0] && selectedIndex[idx] === i ? " sel" : "");
      b.type = "button";
      b.innerHTML = '<span class="tick"></span><span>' + pair[1] + "</span>";
      b.addEventListener("click", function () { choose(pair[0], i); });
      box.appendChild(b);
    });
    $("backBtn").style.visibility = idx === 0 ? "hidden" : "visible";
  }

  var selectedIndex = new Array(QUESTIONS.length).fill(null);

  function choose(key, i) {
    answers[idx] = key;
    selectedIndex[idx] = i;
    var opts = $("options").children;
    for (var k = 0; k < opts.length; k++) opts[k].classList.toggle("sel", k === i);
    var c = FX.center(opts[i]);
    FX.burst(c.x, c.y, 16, 0.85);
    setTimeout(function () {
      if (idx < QUESTIONS.length - 1) { idx++; renderQuestion(); show("quiz"); }
      else { cast(function () { renderResult(); show("result"); }); }
    }, 300);
  }

  /* the spell-casting beat between the last answer and the result */
  function cast(done) {
    var el = $("cast");
    if (REDUCED || !el) { done(); return; }
    el.hidden = false;
    el.classList.remove("out");
    var x = window.innerWidth / 2, y = window.innerHeight / 2;
    var tips = el.querySelectorAll(".cast-wands .tip");

    /* sparks thrown from wherever the wand tips currently are */
    function sparkTips(n, power) {
      for (var i = 0; i < tips.length; i++) {
        var c = FX.center(tips[i]);
        FX.burst(c.x, c.y, n, power || 0.7);
      }
    }

    SND.mode("cast");
    SND.sfx("whoosh");
    FX.swirl(x, y, 44);
    setTimeout(function () { sparkTips(7); }, 260);
    setTimeout(function () { FX.swirl(x, y, 32); sparkTips(7); }, 700);
    setTimeout(function () { sparkTips(10); }, 1180);
    setTimeout(function () {
      FX.burst(x, y, 60, 2.1);
      sparkTips(16, 1.4);
      SND.sfx("boom");
      el.classList.add("out");
    }, 1700);
    setTimeout(function () {
      el.hidden = true;
      el.classList.remove("out");
      done();
    }, 2000);
  }

  $("backBtn").addEventListener("click", function () {
    if (idx > 0) {
      SND.sfx("back"); idx--; renderQuestion(); show("quiz"); }
  });

  function tally() {
    var t = { orman: 0, su: 0, kristal: 0, paldir: 0 };
    answers.forEach(function (a) { if (a) t[a]++; });
    return t;
  }

  function winner(t) {
    var order = ["paldir", "orman", "su", "kristal"]; // tie-break flavour: the title witch first
    var best = null, bestN = -1;
    order.forEach(function (k) { if (t[k] > bestN) { bestN = t[k]; best = k; } });
    return best;
  }

  function renderResult() {
    var t = tally();
    var key = winner(t);
    var w = WITCHES[key];
    var isDark = getComputedStyle(document.documentElement).getPropertyValue("color-scheme").indexOf("dark") > -1
      || window.matchMedia("(prefers-color-scheme: dark)").matches;
    var accent = isDark ? w.accentDark : w.accent;
    document.documentElement.style.setProperty("--accent", accent);

    $("crest").innerHTML = ICONS[key === "paldir" ? "paldir" : key];
    $("crest").style.color = accent;
    var im = $("rImg");
    im.src = w.img;
    im.alt = w.name + " — kitaptan bir çizim";
    $("rName").textContent = w.name;
    $("rTag").textContent = w.tag;
    $("rBody").textContent = w.body;

    var chips = $("rChips"); chips.innerHTML = "";
    w.chips.forEach(function (c) {
      var s = document.createElement("span"); s.className = "chip"; s.textContent = c; chips.appendChild(s);
    });
    $("rBook").innerHTML = w.book;

    SND.mode("result");
    SND.sfx("reveal");

    var r = $("result");
    r.classList.remove("reveal");
    void r.offsetWidth;
    r.classList.add("reveal");
  }

  $("startBtn").addEventListener("click", function (e) {
    var c = FX.center(e.currentTarget);
    FX.burst(c.x, c.y, 24, 1.2);
    SND.start();
    SND.sfx("start");
    var hero = $("coverHero");
    function go() { idx = 0; renderQuestion(); show("quiz"); }
    if (REDUCED || !hero) { go(); return; }
    var hc = FX.center(hero);
    FX.burst(hc.x, hc.y, 30, 1.5);
    hero.classList.add("leaving");
    setTimeout(function () { hero.classList.remove("leaving"); go(); }, 380);
  });

  $("againBtn").addEventListener("click", function () {
    answers = new Array(QUESTIONS.length).fill(null);
    selectedIndex = new Array(QUESTIONS.length).fill(null);
    idx = 0;
    document.documentElement.style.removeProperty("--accent");
    SND.mode("quiz");
    SND.stop();
    show("start");
  });

})();
</script>
</body>
</html>
